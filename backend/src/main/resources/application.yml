spring:
  application:
    name: shortify
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:shortify}
    username: ${POSTGRES_USER:shortify}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

shortify:
  base-url: ${SHORTIFY_BASE_URL:http://localhost:${SERVER_PORT:8080}}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:shortify}
    expires-in: ${JWT_EXPIRES_IN:3600}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
